name: Auto-merge Claude PRs

# Automatically merges open pull requests from claude/* feature branches
# after a successful push, so the user doesn't have to click Merge manually.
#
# Safety controls:
#   - Only acts on branches starting with "claude/"
#   - Skips if the latest commit message contains "[skip-merge]"
#   - Uses --auto so GitHub waits for any required status checks first
#   - Will not run if the PR is in draft state

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check for skip-merge marker
        id: skip-check
        run: |
          MSG=$(git log -1 --pretty=%B "${{ github.sha }}" 2>/dev/null || echo "")
          if echo "$MSG" | grep -q '\[skip-merge\]'; then
            echo "Found [skip-merge] marker — exiting."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find open PR for this branch
        if: steps.skip-check.outputs.skip != 'true'
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          PR_JSON=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --state open \
            --json number,isDraft \
            --jq '.[0]')

          if [ -z "$PR_JSON" ] || [ "$PR_JSON" = "null" ]; then
            echo "No open PR found for $BRANCH — nothing to merge."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number')
          IS_DRAFT=$(echo "$PR_JSON" | jq -r '.isDraft')

          if [ "$IS_DRAFT" = "true" ]; then
            echo "PR #$PR_NUMBER is a draft — skipping auto-merge."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found PR #$PR_NUMBER for branch $BRANCH"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.find-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.find-pr.outputs.pr_number }}"
          # --auto waits for required checks before merging. If no checks
          # are required, GitHub merges immediately.
          # --merge preserves individual commits via a merge commit.
          # Change to --squash for a single-commit history if preferred.
          gh pr merge "$PR" \
            --repo "${{ github.repository }}" \
            --auto \
            --merge \
            || gh pr merge "$PR" \
                 --repo "${{ github.repository }}" \
                 --merge
          echo "Merge requested for PR #$PR"
